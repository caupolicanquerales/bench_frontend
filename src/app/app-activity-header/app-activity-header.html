<header class="activity-header-bar">
  <!-- Left Section: Workout Identity -->
  <div class="workout-identity-group">
    <!-- Activity Icon Anchor -->
    <div class="activity-icon-anchor" title="Running Session" aria-label="Running Icon">
      <svg
        class="icon-svg"
        viewBox="0 0 24 24"
        fill="currentColor"
        aria-hidden="true"
      >
        <!-- Sport Runner Icon -->
        <path
          d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7z"
        />
      </svg>
    </div>

    <!-- Title and Metadata Block -->
    <div class="workout-meta-block">
      <div class="title-row">
        @if (!isEditingTitle()) {
          <h1 class="activity-title" (dblclick)="startEditingTitle()">
            {{ activityTitle() }}
          </h1>
          <button
            type="button"
            class="edit-title-btn"
            (click)="startEditingTitle()"
            title="Edit activity title"
            aria-label="Edit activity title"
          >
            <svg class="edit-icon-svg" viewBox="0 0 20 20" fill="currentColor">
              <path
                d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"
              />
            </svg>
          </button>
        } @else {
          <form class="edit-title-form" (ngSubmit)="saveTitle()">
            <input
              type="text"
              class="edit-title-input"
              [ngModel]="editTitleDraft()"
              (ngModelChange)="editTitleDraft.set($event)"
              name="titleDraft"
              autofocus
            />
            <button type="submit" class="title-action-btn save" title="Save">
              ✓
            </button>
            <button
              type="button"
              class="title-action-btn cancel"
              (click)="cancelEditingTitle()"
              title="Cancel"
            >
              ✕
            </button>
          </form>
        }
      </div>

      <p class="metadata-subtitle">{{ activitySubtitle() }}</p>
    </div>
  </div>

  <!-- Right Section: User Profile & Authentication -->
  <div class="user-auth-section">
    @if (isSignedIn()) {
      <!-- User Details & Interactive Avatar Toggle -->
      <div class="user-profile-wrapper">
        <div class="user-details-text">
          <span class="user-full-name">{{ userName() }}</span>
          <div class="sync-status-row">
            <span
              class="status-dot"
              [class.connected]="isConnected()"
              aria-hidden="true"
            ></span>
            <span class="status-label">Connected</span>
          </div>
        </div>

        <!-- Avatar Button Toggle -->
        <button
          type="button"
          class="avatar-toggle-btn"
          (click)="toggleProfileMenu($event)"
          aria-haspopup="menu"
          [attr.aria-expanded]="isProfileMenuOpen()"
          title="Account menu"
          aria-label="Open user profile menu"
        >
          <img
            [src]="userAvatar()"
            [alt]="userName()"
            class="user-avatar-img"
          />
        </button>

        <!-- Floating Profile Dropdown Menu -->
        @if (isProfileMenuOpen()) {
          <div
            class="profile-dropdown-menu"
            role="menu"
            (click)="$event.stopPropagation()"
          >
            <div class="dropdown-header">
              <span class="dropdown-user-name">{{ userName() }}</span>
              <span class="dropdown-user-email">matias&#64;apextelemetry.io</span>
            </div>

            <div class="dropdown-divider"></div>

            <ul class="dropdown-items-list">
              <li>
                <button
                  type="button"
                  class="dropdown-item"
                  (click)="closeProfileMenu()"
                  role="menuitem"
                >
                  <span class="item-icon">⚙️</span>
                  <span>Account Settings</span>
                </button>
              </li>
            </ul>

            <div class="dropdown-divider"></div>

            <div class="dropdown-footer">
              <button
                type="button"
                class="dropdown-item signout"
                (click)="signOut()"
                role="menuitem"
              >
                <span class="item-icon">🚪</span>
                <span>Sign Out</span>
              </button>
            </div>
          </div>
        }
      </div>
    } @else {
      <!-- Guest View (When Signed Out) -->
      <div class="guest-auth-actions">
        <button
          type="button"
          class="btn-auth btn-signin"
          (click)="signIn()"
        >
          Sign In
        </button>
        <button
          type="button"
          class="btn-auth btn-register"
          (click)="signIn()"
        >
          Register
        </button>
      </div>
    }
  </div>
</header>
